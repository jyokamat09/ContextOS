version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: contextos_user
      POSTGRES_PASSWORD: contextos123
      POSTGRES_DB: contextos
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"